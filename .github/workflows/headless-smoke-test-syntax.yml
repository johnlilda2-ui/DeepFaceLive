name: Headless smoke-test syntax

on:
  push:
    branches:
      - experiment/cloud-headless-webrtc
    paths:
      - "scripts/headless_inference_smoke_test.py"
      - "scripts/headless_webrtc_server.py"
      - "scripts/test_headless_signaling.py"
      - "scripts/test_signaling_gpu_roundtrip.py"
      - "scripts/test_signaling_browser.py"
      - "scripts/webrtc_client.*"
      - "scripts/headless_cloud_worker.py"
      - "scripts/headless_portrait_worker.py"
      - "scripts/headless_lia_portrait_worker.py"
      - "scripts/prepare_portrait_runtime.py"
      - "scripts/prepare_portrait_environment.py"
      - "scripts/test_headless_portrait.py"
      - "scripts/test_portrait_gpu.py"
      - "scripts/prepare_headless_env.py"
      - "scripts/test_prepare_headless_env.py"
      - "scripts/headless_webrtc_track.py"
      - "scripts/test_headless_webrtc_track.py"
      - "scripts/test_webrtc_gpu_roundtrip.py"
      - "scripts/test_headless_worker.py"
      - "scripts/test_headless_cuda_evidence.py"
      - "notebooks/kaggle_headless_inference_smoke_test.ipynb"
      - "notebooks/kaggle_portrait_avatar_test.ipynb"
      - ".github/workflows/headless-smoke-test-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out smoke-test script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/headless_inference_smoke_test.py
            scripts/headless_webrtc_server.py
            scripts/test_headless_signaling.py
            scripts/test_signaling_gpu_roundtrip.py
            scripts/test_signaling_browser.py
            scripts/webrtc_client.html
            scripts/webrtc_client.js
            scripts/webrtc_client.css
            doc/celebs/Millie_Park/Millie_Park.png
            scripts/headless_cloud_worker.py
            scripts/headless_portrait_worker.py
            scripts/headless_lia_portrait_worker.py
            scripts/prepare_portrait_runtime.py
            scripts/prepare_portrait_environment.py
            scripts/test_headless_portrait.py
            scripts/test_portrait_gpu.py
            scripts/prepare_headless_env.py
            scripts/test_prepare_headless_env.py
            scripts/headless_webrtc_track.py
            scripts/test_headless_webrtc_track.py
            scripts/test_webrtc_gpu_roundtrip.py
            scripts/test_headless_worker.py
            scripts/test_headless_cuda_evidence.py
            notebooks/kaggle_headless_inference_smoke_test.ipynb
            notebooks/kaggle_portrait_avatar_test.ipynb
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile smoke-test script
        run: |
          python -m py_compile scripts/headless_inference_smoke_test.py
          python -m py_compile scripts/headless_portrait_worker.py scripts/headless_lia_portrait_worker.py scripts/prepare_portrait_runtime.py scripts/prepare_portrait_environment.py scripts/test_portrait_gpu.py
      - name: Test notebook syntax and CUDA evidence gate (CPU only)
        run: python -m unittest discover -s scripts -p test_headless_cuda_evidence.py
      - name: Install CPU frame-test dependencies
        run: python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Test worker frame contract and compositing
        run: |
          python -m unittest discover -s scripts -p test_headless_worker.py
          python -m unittest discover -s scripts -p test_headless_portrait.py
      - name: Install WebRTC test dependencies
        run: python -m pip install aiortc==1.15.0 av==17.0.0
      - name: Test WebRTC backpressure and shutdown
        run: python -m unittest discover -s scripts -p test_headless_webrtc_track.py -v
      - name: Transfer actual WebRTC video packets (CPU transport only)
        run: python scripts/test_webrtc_gpu_roundtrip.py --transport-only --frames 5
      - name: Test restored environment repair
        run: python -m unittest discover -s scripts -p test_prepare_headless_env.py -v
      - name: Install signaling and browser-test dependencies
        run: python -m pip install aiohttp==3.13.3 Pillow==11.3.0 playwright==1.58.0
      - name: Test HTTP authorization and lifecycle
        run: python -m unittest discover -s scripts -p test_headless_signaling.py -v
      - name: Test HTTP signaling with actual WebRTC packets
        run: python scripts/test_signaling_gpu_roundtrip.py --transport-only
      - name: Install test Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test browser demo, synthetic camera, Stop and reconnect
        run: python scripts/test_signaling_browser.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signaling-browser-evidence
          path: artifacts/signaling-browser/
          if-no-files-found: ignore
